name: Publicar imagem no Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/etapa-02
    paths:
      - .github/workflows/docker-publish.yml
      - .github/docker/Dockerfile.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar os arquivos da versão 1.0
        run: |
          mkdir version-1.0
          git archive b76f5e6df27a086ebe112758cfc7df78c182ed13 | tar -x -C version-1.0
          cp .github/docker/Dockerfile.1.0 version-1.0/Dockerfile

      - name: Construir e publicar a tag 1.0
        uses: docker/build-push-action@v6
        with:
          context: version-1.0
          push: true
          tags: leonardojiahao/bootcamp2-app:1.0

      - name: Construir e publicar as tags 1.1 e latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            leonardojiahao/bootcamp2-app:1.1
            leonardojiahao/bootcamp2-app:latest
