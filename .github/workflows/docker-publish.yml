name: Publicar imagem no Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - codex/etapa-02
    paths:
      - .github/workflows/docker-publish.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar as tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            leonardojiahao/bootcamp2-app:1.0
            leonardojiahao/bootcamp2-app:1.1
            leonardojiahao/bootcamp2-app:latest
